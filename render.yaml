services:
  - type: web
    name: wpa-be-admin
    env: docker
    region: ohio
    plan: free
    branch: main
    buildCommand: docker build -t wpa-be-admin .
    startCommand: docker run -p 3001:3001 wpa-be-admin
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_DEFAULT_VERSION
        value: 20.10.0
      # Scripture comes from the Bible proxy, which holds the API.Bible keys
      # (see README "Scripture"). The console has no API.Bible credentials.
      - key: BIBLE_API_BASE_URL
        value: https://wpa-be-bible-proxy.onrender.com/admin/v1
      # Translation settings (API.Bible IDs, not secrets); set in the Render dashboard
      - key: API_BIBLE_DEFAULT_BIBLE_ID
        sync: false
      - key: API_BIBLE_BIBLE_IDS
        sync: false
